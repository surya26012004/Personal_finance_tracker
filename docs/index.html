<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>WealthWise — Personal Wealth & Portfolio Tracker</title>
  <meta name="description" content="Track your net worth, equity portfolio, mutual funds, daily returns, income & expenses, loans, transactions, and financial goals.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg-main: #F8F9FA;
      --surface: #FFFFFF;
      --surface-subtle: #F1F5F9;
      --border: #E2E8F0;
      --border-subtle: #F1F5F9;
      --text-primary: #0F172A;
      --text-secondary: #475569;
      --text-muted: #94A3B8;
      --primary: #312E81;
      --primary-light: #4338CA;
      --primary-container: #EEF2FF;
      --primary-container-text: #3730A3;
      --emerald: #059669;
      --emerald-bg: #ECFDF5;
      --emerald-light: #D1FAE5;
      --rose: #E11D48;
      --rose-bg: #FFF1F2;
      --rose-light: #FFE4E6;
      --amber: #D97706;
      --amber-bg: #FFFBEB;
      --font-main: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-display: 'Playfair Display', Georgia, serif;
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.07), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--font-main);
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Layout */
    .app-container {
      display: flex;
      flex: 1;
      min-height: 100vh;
    }

    /* Sidebar Navigation (Desktop) */
    .sidebar {
      width: 260px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 24px 16px;
      position: sticky;
      top: 0;
      height: 100vh;
      z-index: 50;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 8px 24px 8px;
      border-bottom: 1px solid var(--border-subtle);
      margin-bottom: 20px;
    }

    .brand-icon {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--primary), #4338CA);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 800;
      font-size: 20px;
      box-shadow: 0 4px 10px rgba(49, 46, 129, 0.25);
    }

    .brand-title {
      font-size: 19px;
      font-weight: 800;
      color: var(--text-primary);
      letter-spacing: -0.5px;
    }

    .brand-subtitle {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .nav-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
      overflow-y: auto;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      color: var(--text-secondary);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      text-decoration: none;
      border: 1px solid transparent;
    }

    .nav-item:hover {
      background: var(--surface-subtle);
      color: var(--text-primary);
    }

    .nav-item.active {
      background: var(--primary-container);
      color: var(--primary-container-text);
      font-weight: 700;
      border-color: rgba(49, 46, 129, 0.1);
    }

    .nav-item i {
      width: 18px;
      height: 18px;
    }

    /* Main Content Area */
    .main-content {
      flex: 1;
      padding: 24px 32px 60px;
      max-width: 1300px;
      margin: 0 auto;
      width: 100%;
    }

    /* Top Bar */
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 16px;
    }

    .page-title {
      font-size: 26px;
      font-weight: 800;
      color: var(--text-primary);
      letter-spacing: -0.5px;
    }

    .page-subtitle {
      font-size: 13px;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 9px 16px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      border: 1px solid transparent;
      white-space: nowrap;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
      box-shadow: var(--shadow-sm);
    }

    .btn-primary:hover {
      background: var(--primary-light);
    }

    .btn-outline {
      background: var(--surface);
      border-color: var(--border);
      color: var(--text-primary);
    }

    .btn-outline:hover {
      background: var(--surface-subtle);
    }

    .btn-danger {
      background: var(--rose-bg);
      color: var(--rose);
      border-color: var(--rose-light);
    }

    .btn-danger:hover {
      background: var(--rose-light);
    }

    .btn-sm {
      padding: 6px 12px;
      font-size: 12px;
    }

    /* Cards */
    .card {
      background: var(--surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 20px;
      box-shadow: var(--shadow-sm);
    }

    .card-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* Metrics Grid */
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .metric-card {
      background: var(--surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 18px 20px;
      position: relative;
    }

    .metric-label {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }

    .metric-value {
      font-size: 24px;
      font-weight: 800;
      color: var(--text-primary);
      letter-spacing: -0.5px;
    }

    .metric-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 20px;
      margin-top: 6px;
    }

    .badge-positive {
      background: var(--emerald-bg);
      color: var(--emerald);
    }

    .badge-negative {
      background: var(--rose-bg);
      color: var(--rose);
    }

    .badge-neutral {
      background: var(--surface-subtle);
      color: var(--text-secondary);
    }

    /* Charts Row */
    .charts-row {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 20px;
      margin-bottom: 24px;
    }

    @media (max-width: 992px) {
      .charts-row {
        grid-template-columns: 1fr;
      }
    }

    /* Filters / Chips */
    .filter-bar {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 16px;
      scrollbar-width: none;
    }

    .filter-chip {
      padding: 6px 14px;
      border-radius: 30px;
      background: var(--surface);
      border: 1px solid var(--border);
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s ease;
    }

    .filter-chip:hover {
      border-color: var(--text-muted);
    }

    .filter-chip.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    /* Tables & Lists */
    .table-container {
      overflow-x: auto;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-subtle);
      background: var(--surface);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th {
      background: var(--surface-subtle);
      padding: 12px 16px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border);
    }

    td {
      padding: 14px 16px;
      font-size: 13px;
      border-bottom: 1px solid var(--border-subtle);
      color: var(--text-primary);
    }

    tr:last-child td {
      border-bottom: none;
    }

    tr:hover td {
      background: #FAFAFC;
    }

    /* Progress bar */
    .progress-track {
      width: 100%;
      height: 8px;
      background: var(--surface-subtle);
      border-radius: 4px;
      overflow: hidden;
      margin: 8px 0;
    }

    .progress-fill {
      height: 100%;
      background: var(--emerald);
      border-radius: 4px;
      transition: width 0.3s ease;
    }

    /* Modals */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.5);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 16px;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal {
      background: var(--surface);
      border-radius: var(--radius-lg);
      width: 100%;
      max-width: 520px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
      padding: 24px;
      border: 1px solid var(--border-subtle);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .modal-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }

    .form-control {
      width: 100%;
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      font-size: 14px;
      color: var(--text-primary);
      background: var(--surface);
      outline: none;
      transition: border 0.15s ease;
    }

    .form-control:focus {
      border-color: var(--primary);
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 24px;
    }

    /* Mobile Bottom Navigation */
    .mobile-nav {
      display: none;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 8px 12px calc(8px + env(safe-area-inset-bottom, 0px));
      z-index: 40;
      justify-content: space-around;
    }

    .mobile-nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: var(--text-muted);
      font-size: 10px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      padding: 4px 8px;
    }

    .mobile-nav-item.active {
      color: var(--primary);
    }

    @media (max-width: 768px) {
      .sidebar {
        display: none;
      }
      .mobile-nav {
        display: flex;
      }
      .main-content {
        padding: 16px 16px 80px;
      }
      .page-title {
        font-size: 20px;
      }
      .metrics-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<script>
// Data Store with LocalStorage Persistence
const DEFAULT_STATE = {

  ],

  ]
};

function loadState() {
  const saved = localStorage.getItem("wealthwise_db");
  if (saved) {
    try { return JSON.parse(saved); } catch (e) { console.error(e); }
  }
  return DEFAULT_STATE;
}

let appState = loadState();

function saveState() {
  localStorage.setItem("wealthwise_db", JSON.stringify(appState));
}

let activeView = 'dashboard';
let chartInstances = {};

function formatCurrency(amount, symbol = appState.settings.currencySymbol) {
  if (isNaN(amount)) return `${symbol}0`;
  const isNegative = amount < 0;
  const abs = Math.abs(amount);
  let formatted = "";
  if (symbol === "₹") {
    formatted = abs.toLocaleString('en-IN', { maximumFractionDigits: 2 });
  } else {
    formatted = abs.toLocaleString('en-US', { maximumFractionDigits: 2 });
  }
  return `${isNegative ? "-" : ""}${symbol}${formatted}`;
}

function calculateSummary() {
  let totalInvested = 0;
  let totalCurrentValue = 0;
  let todayGain = 0;

  appState.holdings.forEach(h => {
    const invested = h.units * h.buyPrice;
    const current = h.units * h.currentPrice;
    const prev = h.units * (h.previousClosePrice || h.currentPrice);
    totalInvested += invested;
    totalCurrentValue += current;
    todayGain += (current - prev);
  });

  const totalPL = totalCurrentValue - totalInvested;
  const totalPLPercent = totalInvested > 0 ? (totalPL / totalInvested) * 100 : 0;
  const todayGainPercent = (totalCurrentValue - todayGain) > 0 ? (todayGain / (totalCurrentValue - todayGain)) * 100 : 0;

  const totalLiabilities = appState.loans.reduce((sum, l) => sum + l.outstandingBalance, 0);
  const netWorth = totalCurrentValue - totalLiabilities;

  const totalIncome = appState.cashflows.filter(c => c.type === 'INCOME').reduce((s, c) => s + c.amount, 0);
  const totalExpense = appState.cashflows.filter(c => c.type === 'EXPENSE').reduce((s, c) => s + c.amount, 0);
  const savingsRate = totalIncome > 0 ? ((totalIncome - totalExpense) / totalIncome) * 100 : 0;

  return {
    totalInvested,
    totalCurrentValue,
    totalPL,
    totalPLPercent,
    todayGain,
    todayGainPercent,
    totalLiabilities,
    netWorth,
    totalIncome,
    totalExpense,
    savingsRate
  };
}

function switchView(viewName) {
  activeView = viewName;
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.mobile-nav-item').forEach(el => el.classList.remove('active'));

  // Update active links
  document.querySelectorAll(`.nav-item[onclick="switchView('${viewName}')"]`).forEach(el => el.classList.add('active'));
  document.querySelectorAll(`.mobile-nav-item[onclick="switchView('${viewName}')"]`).forEach(el => el.classList.add('active'));

  renderView();
}

function initDashboardCharts() {
  const growthCtx = document.getElementById('growthChart')?.getContext('2d');
  if (growthCtx) {
    const summary = calculateSummary();
    const currentVal = summary.totalCurrentValue;
    const labels = ['6 Mo Ago', '5 Mo Ago', '4 Mo Ago', '3 Mo Ago', '2 Mo Ago', '1 Mo Ago', 'Today'];
    const dataPoints = [
      currentVal * 0.82,
      currentVal * 0.85,
      currentVal * 0.88,
      currentVal * 0.91,
      currentVal * 0.94,
      currentVal * 0.97,
      currentVal
    ];

    chartInstances.growth = new Chart(growthCtx, {
      type: 'line',
      data: {
        labels: labels,
        datasets: [{
          label: 'Valuation',
          data: dataPoints,
          borderColor: '#312E81',
          backgroundColor: 'rgba(49, 46, 129, 0.08)',
          borderWidth: 2.5,
          fill: true,
          tension: 0.35,
          pointRadius: 4,
          pointBackgroundColor: '#312E81'
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          y: { grid: { color: '#F1F5F9' }, ticks: { font: { size: 10 } } },
          x: { grid: { display: false }, ticks: { font: { size: 10 } } }
        }
      }
    });
  }

  const donutCtx = document.getElementById('donutChart')?.getContext('2d');
  if (donutCtx) {
    const categoryTotals = {};
    appState.holdings.forEach(h => {
      const cat = h.category.replace(/_/g, ' ');
      categoryTotals[cat] = (categoryTotals[cat] || 0) + (h.units * h.currentPrice);
    });

    chartInstances.donut = new Chart(donutCtx, {
      type: 'doughnut',
      data: {
        labels: Object.keys(categoryTotals),
        datasets: [{
          data: Object.values(categoryTotals),
          backgroundColor: ['#312E81', '#059669', '#3B82F6', '#F59E0B', '#10B981', '#8B5CF6', '#EC4899'],
          borderWidth: 2,
          borderColor: '#FFFFFF'
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { position: 'bottom', labels: { boxWidth: 10, font: { size: 10 } } }
        },
        cutout: '70%'
      }
    });
  }
}

function renderHoldingsRows(list) {
  return list.map(h => {
    const val = h.units * h.currentPrice;
    const invested = h.units * h.buyPrice;
    const gain = val - invested;
    const pct = invested > 0 ? (gain / invested) * 100 : 0;
    return `
      <tr>
        <td><strong>${h.name}</strong></td>
        <td><span class="metric-badge badge-neutral">${h.category.replace(/_/g, ' ')}</span></td>
        <td>${h.units}</td>
        <td>${formatCurrency(h.buyPrice)}</td>
        <td><strong>${formatCurrency(h.currentPrice)}</strong></td>
        <td>${formatCurrency(invested)}</td>
        <td><strong>${formatCurrency(val)}</strong></td>
        <td style="color: ${gain >= 0 ? 'var(--emerald)' : 'var(--rose)'}; font-weight: 700;">
          ${gain >= 0 ? '+' : ''}${formatCurrency(gain)}<br>
          <small>(${pct.toFixed(1)}%)</small>
        </td>
        <td>
          <button class="btn btn-danger btn-sm" onclick="deleteHolding('${h.id}')">Delete</button>
        </td>
      </tr>
    `;
  }).join('');
}

function filterHoldings(category) {
  document.querySelectorAll('.filter-chip').forEach(el => el.classList.remove('active'));
  event.target.classList.add('active');
  const filtered = category === 'ALL' ? appState.holdings : appState.holdings.filter(h => h.category === category);
  document.getElementById('holdings-table-body').innerHTML = renderHoldingsRows(filtered);
}

function adjustPrice(id, factor) {
  const input = document.getElementById(`price-input-${id}`);
  if (input) {
    const val = parseFloat(input.value) || 0;
    input.value = (val * factor).toFixed(2);
  }
}

function savePrices() {
  appState.holdings.forEach(h => {
    const input = document.getElementById(`price-input-${h.id}`);
    if (input) {
      const val = parseFloat(input.value);
      if (!isNaN(val) && val > 0) {
        h.previousClosePrice = h.currentPrice;
        h.currentPrice = val;
      }
    }
  });
  saveState();
  alert("Daily prices saved successfully!");
  renderView();
}

function deleteHolding(id) {
  if (confirm("Delete this asset?")) {
    appState.holdings = appState.holdings.filter(h => h.id !== id);
    saveState();
    renderView();
  }
}

function deleteCashflow(id) {
  appState.cashflows = appState.cashflows.filter(c => c.id !== id);
  saveState();
  renderView();
}

function deleteLoan(id) {
  appState.loans = appState.loans.filter(l => l.id !== id);
  saveState();
  renderView();
}

function payEmi(id) {
  const loan = appState.loans.find(l => l.id === id);
  if (loan) {
    loan.outstandingBalance = Math.max(0, loan.outstandingBalance - loan.monthlyEmi);
    saveState();
    alert(`EMI of ${formatCurrency(loan.monthlyEmi)} recorded!`);
    renderView();
  }
}

function deleteGoal(id) {
  appState.goals = appState.goals.filter(g => g.id !== id);
  saveState();
  renderView();
}

function contributeGoal(id) {
  const amtStr = prompt("Enter contribution amount:");
  const amt = parseFloat(amtStr);
  if (!isNaN(amt) && amt > 0) {
    const goal = appState.goals.find(g => g.id === id);
    if (goal) {
      goal.currentAmount += amt;
      saveState();
      renderView();
    }
  }
}

function deleteTransaction(id) {
  appState.transactions = appState.transactions.filter(t => t.id !== id);
  saveState();
  renderView();
}

function deleteJournal(id) {
  appState.journals = appState.journals.filter(j => j.id !== id);
  saveState();
  renderView();
}

function changeCurrency(val) {
  appState.settings.currencySymbol = val;
  saveState();
  renderView();
}

function exportData() {
  const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(appState, null, 2));
  const a = document.createElement('a');
  a.setAttribute("href", dataStr);
  a.setAttribute("download", `wealthwise_backup_${new Date().toISOString().slice(0,10)}.json`);
  document.body.appendChild(a);
  a.click();
  a.remove();
}

function importData(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = JSON.parse(e.target.result);
      appState = data;
      saveState();
      alert("Backup successfully restored!");
      renderView();
    } catch (err) {
      alert("Invalid JSON format!");
    }
  };
  reader.readAsText(file);
}

function resetDemoData() {
  if (confirm("Reset to default demonstration portfolio?")) {
    appState = JSON.parse(JSON.stringify(DEFAULT_STATE));
    saveState();
    renderView();
  }
}

  const container = document.getElementById('modal-container');

}
